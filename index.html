  <body>
    <!-- Écran de chargement en HTML pur : visible avant même que le JavaScript arrive. -->
    <div id="loader">
      <p class="loader-title">Laurick Bouquet</p>
      <p class="loader-sub" id="loader-sub">Chargement du village…</p>
      <a class="loader-fast" id="loader-fast" href="/cv/">Mode rapide : le CV en un clic</a>
    </div>
    <script>
      // Même règle de langue que le jeu : réglage mémorisé, sinon langue du navigateur.
      try {
        var saved = JSON.parse(localStorage.getItem('village-settings') || 'null')
        var lang = (saved && saved.state && saved.state.lang) || (navigator.language.toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en')
        if (lang === 'en') {
          document.documentElement.lang = 'en'
          document.getElementById('loader-sub').textContent = 'Loading the village…'
          var fast = document.getElementById('loader-fast')
          fast.textContent = 'Quick mode: the resume in one click'
          fast.href = '/cv/en/'
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
  </body>
